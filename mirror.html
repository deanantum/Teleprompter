<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Mirror</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; margin: 0; padding: 0; overflow: hidden; color: #fff; font-family: sans-serif; }
        /* Block flow like main #teleprompter-view so bottom runway counts in scrollHeight. */
        #scroll-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.42) transparent;
            padding-left: 32px;
            box-sizing: border-box;
            display: block;
        }
        #scroll-container::-webkit-scrollbar {
            display: block;
            width: 12px;
        }
        #scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.38);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        #scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.55);
            background-clip: padding-box;
        }
        #mirror-content {
            width: 100%;
            padding: 0;
            margin: 0;
            display: block;
        }
        /* Small gap between script and bottom pill (matches main .teleprompter-runway) */
        .mirror-text-runway {
            display: block;
            min-height: 1.4em;
            width: 100%;
            pointer-events: none;
        }
        /* Scroll room below bottom blue pill (matches main .teleprompter-bottom-spacer) */
        .mirror-bottom-spacer {
            display: block;
            min-height: 50vh;
            height: 50vh;
            width: 100%;
            pointer-events: none;
            background-color: #000;
        }
        /* Same structure as main; visible column uses same width as main so wrapping and row height match */
        .mirror-table .script-row-wrapper {
            display: flex !important;
            width: 100% !important;
            border-bottom: 1px solid #444;
            align-items: stretch;
            padding: 0 !important;
            margin: 0 !important;
            line-height: 1.1 !important;
        }
        .mirror-table .script-column {
            flex: 0 0 auto;
            display: none;
            flex-direction: column;
            min-width: 0;
            padding: 0;
            margin: 0;
            border: none;
        }
        .mirror-table .script-column.mirror-visible {
            display: flex !important;
            width: var(--mirror-content-width, 100%);
            max-width: var(--mirror-content-width, 100%);
            min-width: 0;
        }
        .mirror-table .cell-content {
            flex: 1;
            display: block;
            line-height: 1.1 !important;
            font-size: inherit;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
            white-space: pre-wrap;
            color: inherit;
            padding: 0;
            margin: 0;
            min-width: 0;
        }
        .mirror-table .cell-content b,
        .mirror-table .cell-content i,
        .mirror-table .cell-content u,
        .mirror-table .cell-content .format-span-inline,
        .mirror-table .cell-content .color-span-inline,
        .mirror-table .cell-content span[style*="color"],
        .mirror-table .cell-content span[style*="background"],
        .mirror-table .cell-content span[style*="font-size"] {
            display: inline !important;
        }
        .mirror-table .script-row-wrapper.row-lines-same { background-color: #000000 !important; }
        .mirror-table .script-row-wrapper.row-col2-one-more { background: #000000 !important; }
        .mirror-table .script-row-wrapper.row-col2-one-more .script-column:nth-child(2) { background: linear-gradient(to right, rgba(0, 45, 4, 1) 0%, rgba(0, 45, 4, 0.9) 8%, rgba(0, 45, 4, 0.5) 18%, rgba(0, 45, 4, 0.15) 28%, transparent 35%), transparent !important; }
        .mirror-table .script-row-wrapper.row-col2-one-more .script-column:last-child { background: linear-gradient(to left, rgba(0, 45, 4, 1) 0%, rgba(0, 45, 4, 0.9) 8%, rgba(0, 45, 4, 0.5) 18%, rgba(0, 45, 4, 0.15) 28%, transparent 35%), transparent !important; }
        .mirror-table .script-row-wrapper.row-col3-one-more { background: #000000 !important; }
        .mirror-table .script-row-wrapper.row-col3-one-more .script-column:nth-child(2) { background: linear-gradient(to right, rgba(83, 21, 22, 1) 0%, rgba(83, 21, 22, 0.9) 8%, rgba(83, 21, 22, 0.5) 18%, rgba(83, 21, 22, 0.15) 28%, transparent 35%), transparent !important; }
        .mirror-table .script-row-wrapper.row-col3-one-more .script-column:last-child { background: linear-gradient(to left, rgba(83, 21, 22, 1) 0%, rgba(83, 21, 22, 0.9) 8%, rgba(83, 21, 22, 0.5) 18%, rgba(83, 21, 22, 0.15) 28%, transparent 35%), transparent !important; }
        .mirror-table .script-row-wrapper.row-col2-more { background-color: #002D04 !important; color: #ffffff !important; }
        .mirror-table .script-row-wrapper.row-col3-more,
        .mirror-table .script-row-wrapper.row-col3-much-more { background-color: #531516 !important; color: #ffffff !important; }
        /* Match main: line spacing on shorter column fills row when red/green (stretch classes from main) */
        .mirror-table .script-row-wrapper.row-stretch-col2 .script-column.mirror-visible .cell-content,
        .mirror-table .script-row-wrapper.row-stretch-col2 .script-column.mirror-visible .cell-content *,
        .mirror-table .script-row-wrapper.row-stretch-col3 .script-column.mirror-visible .cell-content,
        .mirror-table .script-row-wrapper.row-stretch-col3 .script-column.mirror-visible .cell-content * {
            line-height: inherit !important;
        }
        .mirror-table .script-row-wrapper.mirror-row-font-12 .script-column .cell-content {
            font-size: 12px !important;
            line-height: 1.2 !important;
        }
        /* Keyword pills (match main: font-size inherit, padding left only) */
        .mirror-table .script-row-wrapper.keyword-pill-red,
        .mirror-table .script-row-wrapper.keyword-pill-yellow,
        .mirror-table .script-row-wrapper.keyword-pill-green,
        .mirror-table .script-row-wrapper.keyword-pill-blue,
        .mirror-table .script-row-wrapper.keyword-pill-white {
            border-radius: 9999px; padding: 0 0 0 16px !important; margin: 0 !important; border: none !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-red {
            background-color: #dc2626 !important; color: #000000 !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-red .script-column,
        .mirror-table .script-row-wrapper.keyword-pill-red .cell-content,
        .mirror-table .script-row-wrapper.keyword-pill-red .script-column * {
            color: #000000 !important; background: transparent !important; border: none !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-yellow {
            background-color: #ffda03 !important; color: #000000 !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-yellow .script-column,
        .mirror-table .script-row-wrapper.keyword-pill-yellow .cell-content,
        .mirror-table .script-row-wrapper.keyword-pill-yellow .script-column * {
            color: #000000 !important; background: transparent !important; border: none !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-green {
            background-color: #22c55e !important; color: #000000 !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-green .script-column,
        .mirror-table .script-row-wrapper.keyword-pill-green .cell-content,
        .mirror-table .script-row-wrapper.keyword-pill-green .script-column * {
            color: #000000 !important; background: transparent !important; border: none !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-blue {
            background-color: #2563eb !important; color: #ffffff !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-blue .script-column,
        .mirror-table .script-row-wrapper.keyword-pill-blue .cell-content,
        .mirror-table .script-row-wrapper.keyword-pill-blue .script-column * {
            color: #ffffff !important; background: transparent !important; border: none !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-white {
            background-color: #ffffff !important; color: #000000 !important;
        }
        .mirror-table .script-row-wrapper.keyword-pill-white .script-column,
        .mirror-table .script-row-wrapper.keyword-pill-white .cell-content,
        .mirror-table .script-row-wrapper.keyword-pill-white .script-column * {
            color: #000000 !important; background: transparent !important; border: none !important;
        }
        #mirror-sync-guide {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            top: var(--mirror-indicator-top-px, var(--mirror-indicator-position, 50%));
            transform: translateY(-50%);
            background: transparent;
            backdrop-filter: invert(1);
            -webkit-backdrop-filter: invert(1);
            z-index: 100;
            pointer-events: none;
        }
        /* Filename pills: light blue fill, black text, pill shape, full width (match main) */
        .mirror-filename-pill {
            display: block;
            width: 100%;
            padding: 8px 20px;
            background-color: #87CEEB;
            color: #000000;
            border-radius: 9999px;
            line-height: 1.4;
            font-weight: 500;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            -webkit-text-fill-color: currentColor;
        }
        .mirror-filename-pill-bottom {
            margin-bottom: 0;
            margin-top: 0;
        }
        .mirror-filename-pill.hidden { display: none !important; }
        /* Same stack as main #teleprompter-view: spacer → runway → pill; heights set inline from main offsetHeight (like row heights). */
        .mirror-top-spacer,
        .mirror-top-runway {
            display: block;
            width: 100%;
            pointer-events: none;
            background-color: #000;
            min-height: 0;
        }
    </style>
</head>
<body>
    <div id="scroll-container">
        <div id="mirror-top-spacer" class="mirror-top-spacer" aria-hidden="true"></div>
        <div id="mirror-top-runway" class="mirror-top-runway" aria-hidden="true"></div>
        <div id="mirror-pill-top" class="mirror-filename-pill hidden" aria-hidden="true"></div>
        <div id="mirror-content" class="mirror-table"></div>
        <div id="mirror-text-runway" class="mirror-text-runway" aria-hidden="true"></div>
        <div id="mirror-pill-bottom" class="mirror-filename-pill mirror-filename-pill-bottom hidden" aria-hidden="true"></div>
        <div id="mirror-bottom-spacer" class="mirror-bottom-spacer" aria-hidden="true"></div>
    </div>
    <div id="mirror-sync-guide"></div>
    <script>
        (function() {
            var debugMode = /(?:^|[?&])debug=1(?:&|$)/.test(window.location.search);

            function isMirrorFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            }

            function exitFullscreenIfNeeded() {
                var doc = document;
                var exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
                if (exit) {
                    try { exit.call(doc); } catch (_) {}
                }
            }

            function enterFullscreen() {
                if (debugMode || isMirrorFullscreen()) return;
                var el = document.documentElement;
                var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (!req) return;
                try {
                    var result = req.call(el, { navigationUI: 'hide' });
                    if (result && typeof result.catch === 'function') {
                        result.catch(function() {});
                    }
                } catch (_) {
                    try {
                        var fallback = req.call(el);
                        if (fallback && typeof fallback.catch === 'function') {
                            fallback.catch(function() {});
                        }
                    } catch (_) {}
                }
            }

            function scheduleMirrorFullscreenAttempts() {
                if (debugMode) return;
                [0, 40, 120, 300, 700, 1500, 3000, 5000].forEach(function(ms) {
                    setTimeout(enterFullscreen, ms);
                });
            }

            window.__teleprompterScheduleMirrorFullscreen = scheduleMirrorFullscreenAttempts;

            function setMirrorDebugMode(enabled) {
                debugMode = !!enabled;
                if (debugMode) exitFullscreenIfNeeded();
                else scheduleMirrorFullscreenAttempts();
            }

            function onMirrorMessage(e) {
                var data = e.data || {};
                if (data.type === 'setMirrorDebugMode') setMirrorDebugMode(!!data.enabled);
                if (data.type === 'requestMirrorFullscreen') scheduleMirrorFullscreenAttempts();
            }

            window.addEventListener('message', onMirrorMessage);
            window.addEventListener('load', function() {
                if (!debugMode) scheduleMirrorFullscreenAttempts();
            });
            window.addEventListener('focus', function() {
                if (!debugMode) enterFullscreen();
            });
            window.addEventListener('pointerdown', function() {
                if (!debugMode) enterFullscreen();
            }, true);
            window.addEventListener('keydown', function(e) {
                if (debugMode) return;
                if (e.key === 'Enter' || e.key === ' ') {
                    enterFullscreen();
                }
            });
        })();
    </script>
    <script>
        (function() {
            const container = document.getElementById('scroll-container');
            const display = document.getElementById('mirror-content');
            let suppressMirrorScrollPosts = 0;
            let lastPixelSyncData = null;
            const mirrorChannel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('teleprompter-mirror-sync') : null;

            function postToMain(payload) {
                if (mirrorChannel) mirrorChannel.postMessage(payload);
                if (window.opener && !window.opener.closed) {
                    try { window.opener.postMessage(payload, '*'); } catch (e) {}
                }
            }

            function escapeHtml(text) {
                if (text == null) return '';
                var div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /** Decode &lt; &gt; &amp; &quot; &#39; &nbsp; numeric entities, including double-encoded (&amp;gt;). */
            function decodeHtmlEntitiesFully(str) {
                var prev = String(str || '');
                var textarea = document.createElement('textarea');
                for (var i = 0; i < 6; i++) {
                    textarea.innerHTML = prev;
                    var next = textarea.value;
                    if (next === prev) break;
                    prev = next;
                }
                return prev;
            }

            function mirrorCellHasHtmlMarkup(raw) {
                return /<[a-zA-Z][^>]*>/.test(String(raw || ''));
            }

            function sanitizeMirrorCellHtml(raw) {
                return String(raw || '').replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
            }

            function mirrorCellHasVisibleText(raw) {
                var probe = document.createElement('div');
                probe.innerHTML = sanitizeMirrorCellHtml(raw);
                return !!(probe.textContent || '').replace(/\u00a0/g, ' ').trim();
            }

            function normalizeMirrorCellMarkup(cell) {
                if (cell == null) return '\u00A0';
                var raw = String(cell).trim();
                if (!raw) return '\u00A0';
                if (!mirrorCellHasVisibleText(raw)) return '\u00A0';
                if (mirrorCellHasHtmlMarkup(raw)) {
                    var box = document.createElement('div');
                    box.innerHTML = sanitizeMirrorCellHtml(raw);
                    return box.innerHTML;
                }
                var decoded = decodeHtmlEntitiesFully(raw);
                return escapeHtml(decoded).replace(/\n/g, '<br>');
            }

            function mirrorBalanceColWidthPx(col) {
                return Math.max(1, Math.floor(col.getBoundingClientRect().width));
            }
            function clearMirrorBalanceProbe(cell) {
                cell.style.removeProperty('flex');
                cell.style.removeProperty('align-self');
                cell.style.removeProperty('height');
                cell.style.removeProperty('min-height');
                cell.style.removeProperty('max-height');
                cell.style.removeProperty('width');
                cell.style.removeProperty('box-sizing');
            }
            function measureMirrorCellNaturalHeight(cell, col) {
                var w = mirrorBalanceColWidthPx(col);
                cell.style.setProperty('flex', '0 0 auto', 'important');
                cell.style.setProperty('align-self', 'flex-start', 'important');
                cell.style.setProperty('height', 'auto', 'important');
                cell.style.setProperty('min-height', '0', 'important');
                cell.style.setProperty('max-height', 'none', 'important');
                cell.style.setProperty('width', w + 'px', 'important');
                cell.style.setProperty('box-sizing', 'border-box', 'important');
                void cell.offsetHeight;
                var natural = cell.offsetHeight;
                clearMirrorBalanceProbe(cell);
                return natural;
            }
            function measureMirrorHeightAtLh(cell, col, lhPx) {
                var w = mirrorBalanceColWidthPx(col);
                cell.style.setProperty('line-height', lhPx + 'px', 'important');
                cell.style.setProperty('flex', '0 0 auto', 'important');
                cell.style.setProperty('align-self', 'flex-start', 'important');
                cell.style.setProperty('height', 'auto', 'important');
                cell.style.setProperty('min-height', '0', 'important');
                cell.style.setProperty('max-height', 'none', 'important');
                cell.style.setProperty('width', w + 'px', 'important');
                cell.style.setProperty('box-sizing', 'border-box', 'important');
                void cell.offsetHeight;
                return cell.offsetHeight;
            }

            function ensureMirrorTopChrome() {
                var root = document.getElementById('scroll-container');
                if (!root) return { spacer: null, runway: null, pillTop: null, content: null };
                var pillTop = document.getElementById('mirror-pill-top');
                var content = document.getElementById('mirror-content');
                var anchor = pillTop || content;
                if (!anchor) return { spacer: null, runway: null, pillTop: pillTop, content: content };

                var spacer = document.getElementById('mirror-top-spacer');
                if (!spacer) {
                    spacer = document.createElement('div');
                    spacer.id = 'mirror-top-spacer';
                    spacer.className = 'mirror-top-spacer';
                    spacer.setAttribute('aria-hidden', 'true');
                    root.insertBefore(spacer, anchor);
                }
                var runway = document.getElementById('mirror-top-runway');
                if (!runway) {
                    runway = document.createElement('div');
                    runway.id = 'mirror-top-runway';
                    runway.className = 'mirror-top-runway';
                    runway.setAttribute('aria-hidden', 'true');
                    if (pillTop && pillTop.parentNode === root) root.insertBefore(runway, pillTop);
                    else root.insertBefore(runway, anchor);
                }
                if (pillTop && pillTop.parentNode === root) {
                    if (spacer.parentNode === root && spacer.nextElementSibling !== runway) root.insertBefore(spacer, runway);
                    if (runway.parentNode === root && runway.nextElementSibling !== pillTop) root.insertBefore(runway, pillTop);
                }
                return { spacer: spacer, runway: runway, pillTop: pillTop, content: content };
            }

            function defaultMirrorLayoutFromViewport() {
                var ih = window.innerHeight || document.documentElement.clientHeight || 800;
                var rootFs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
                var ts = Math.max(0, Math.round(ih * 0.5 - 8 * rootFs));
                var tr = Math.max(Math.round(10 * rootFs), Math.round(ih * 0.22));
                var gap = Math.round(1.4 * rootFs);
                return { topSpacerPx: ts, topRunwayPx: tr, pillGapPx: gap, leaderPx: ts + tr + gap };
            }

            function shrinkMirrorPillToFit(el, minPx) {
                if (!el || el.classList.contains('hidden')) return;
                minPx = minPx || 10;
                var maxW = el.clientWidth;
                if (maxW <= 0) return;
                var size = parseFloat(window.getComputedStyle(el).fontSize) || 16;
                el.style.setProperty('font-size', size + 'px', 'important');
                el.style.setProperty('line-height', '1.4', 'important');
                void el.offsetWidth;
                while (el.scrollWidth > maxW && size > minPx) {
                    size = Math.max(minPx, size - 2);
                    el.style.setProperty('font-size', size + 'px', 'important');
                    void el.offsetWidth;
                }
            }

            function applyMirrorIndicatorGuide(data) {
                var guide = document.getElementById('mirror-sync-guide');
                if (!guide || !container) return;
                if (typeof data.indicatorViewportPx === 'number' && !isNaN(data.indicatorViewportPx)) {
                    var cr = container.getBoundingClientRect();
                    document.documentElement.style.setProperty('--mirror-indicator-top-px', (cr.top + data.indicatorViewportPx) + 'px');
                    return;
                }
                if (typeof data.indicatorPosition === 'number' && !isNaN(data.indicatorPosition)) {
                    document.documentElement.style.removeProperty('--mirror-indicator-top-px');
                    var viewH = container.clientHeight || 0;
                    var px = viewH > 0
                        ? Math.round((Math.max(0, Math.min(100, data.indicatorPosition)) / 100) * viewH)
                        : null;
                    if (px != null) {
                        document.documentElement.style.setProperty('--mirror-indicator-top-px', (container.getBoundingClientRect().top + px) + 'px');
                    } else {
                        document.documentElement.style.setProperty('--mirror-indicator-position', data.indicatorPosition + '%');
                    }
                }
            }

            function applyMirrorScrollSync(data) {
                if (!data || !container) return;
                var display = document.getElementById('mirror-content');
                var mainScroll = Math.round(data.contentScrollY || data.scrollTop || 0);
                var target = mainScroll;
                if (display && data.rowOriginYs && data.rowOriginYs.length > 0) {
                    var mirrorRows = display.querySelectorAll('.script-row-wrapper');
                    if (mirrorRows.length > 0) {
                        var mirrorRow0Origin = Math.round((display.offsetTop || 0) + (mirrorRows[0].offsetTop || 0));
                        target = mainScroll + (mirrorRow0Origin - Math.round(data.rowOriginYs[0]));
                    }
                } else if (display && typeof data.scriptOffsetTop === 'number' && !isNaN(data.scriptOffsetTop)) {
                    target = mainScroll + (Math.round(display.offsetTop || 0) - Math.round(data.scriptOffsetTop));
                }
                if (target < 0) target = 0;
                var maxScroll = Math.max(0, container.scrollHeight - container.clientHeight);
                if (target > maxScroll) target = maxScroll;
                container.scrollTop = target;
            }

            function applyMirrorPills(data) {
                if (!data) return;
                function updateOne(el, text, fontSize, fontFamily) {
                    if (!el) return el;
                    if (text !== undefined && text !== null) {
                        var label = String(text).trim();
                        el.textContent = label;
                        el.classList.toggle('hidden', !label);
                        el.setAttribute('aria-hidden', label ? 'false' : 'true');
                        if (label) {
                            el.style.setProperty('color', '#000000', 'important');
                            el.style.setProperty('-webkit-text-fill-color', 'currentColor', 'important');
                        }
                    }
                    if (fontSize) el.style.setProperty('font-size', fontSize, 'important');
                    if (fontFamily) el.style.setProperty('font-family', fontFamily, 'important');
                    return el;
                }
                var topPillEl = updateOne(
                    document.getElementById('mirror-pill-top'),
                    data.topPill,
                    data.topPillFontSize,
                    data.topPillFontFamily
                );
                var bottomPillEl = updateOne(
                    document.getElementById('mirror-pill-bottom'),
                    data.bottomPill,
                    data.bottomPillFontSize,
                    data.bottomPillFontFamily
                );
                requestAnimationFrame(function() {
                    shrinkMirrorPillToFit(topPillEl);
                    shrinkMirrorPillToFit(bottomPillEl);
                });
            }

            function applyMirrorLayout(layout) {
                if (!layout) layout = defaultMirrorLayoutFromViewport();
                var chrome = ensureMirrorTopChrome();
                var spacer = chrome.spacer;
                var runway = chrome.runway;
                var pillTop = chrome.pillTop;
                var content = chrome.content;

                var ts = typeof layout.topSpacerPx === 'number' && !isNaN(layout.topSpacerPx) ? Math.max(0, Math.round(layout.topSpacerPx)) : 0;
                var tr = typeof layout.topRunwayPx === 'number' && !isNaN(layout.topRunwayPx) ? Math.max(0, Math.round(layout.topRunwayPx)) : 0;
                var gap = typeof layout.pillGapPx === 'number' && !isNaN(layout.pillGapPx) ? Math.max(0, Math.round(layout.pillGapPx)) : 0;
                var leaderPx = typeof layout.leaderPx === 'number' && !isNaN(layout.leaderPx) ? Math.max(0, Math.round(layout.leaderPx)) : 0;

                if (ts + tr === 0 && leaderPx > 0) {
                    ts = leaderPx;
                    gap = 0;
                }

                function setBlackBand(el, h) {
                    if (!el) return;
                    if (h > 0) {
                        el.style.setProperty('min-height', h + 'px', 'important');
                        el.style.setProperty('height', h + 'px', 'important');
                        el.style.setProperty('flex-shrink', '0', 'important');
                        el.style.setProperty('background-color', '#000', 'important');
                    } else {
                        el.style.removeProperty('min-height');
                        el.style.removeProperty('height');
                        el.style.removeProperty('flex-shrink');
                        el.style.removeProperty('background-color');
                    }
                }

                setBlackBand(spacer, ts);
                setBlackBand(runway, tr);

                if (pillTop) {
                    pillTop.style.minHeight = '';
                    pillTop.style.boxSizing = '';
                }

                var pillHidden = pillTop && pillTop.classList.contains('hidden');
                if (pillHidden) {
                    if (pillTop) pillTop.style.removeProperty('margin-top');
                    if (content) {
                        if (gap > 0) content.style.setProperty('margin-top', gap + 'px', 'important');
                        else content.style.removeProperty('margin-top');
                    }
                } else {
                    if (content) content.style.removeProperty('margin-top');
                    if (pillTop) {
                        if (gap > 0) pillTop.style.setProperty('margin-top', gap + 'px', 'important');
                        else pillTop.style.removeProperty('margin-top');
                    }
                }
                requestAnimationFrame(function() {
                    shrinkMirrorPillToFit(pillTop);
                    shrinkMirrorPillToFit(document.getElementById('mirror-pill-bottom'));
                });
            }

            function applyMirrorShortColumnLineBalance(displayRoot, visibleColumnIndex) {
                if (!displayRoot) return;
                var rows = displayRoot.querySelectorAll('.script-row-wrapper');
                for (var ri = 0; ri < rows.length; ri++) {
                    var row = rows[ri];
                    var wantCol = 0;
                    if (row.classList.contains('row-stretch-col2')) wantCol = 2;
                    else if (row.classList.contains('row-stretch-col3')) wantCol = 3;
                    else continue;
                    if (visibleColumnIndex !== wantCol - 1) continue;
                    var col = row.querySelector('.script-column:nth-child(' + wantCol + ')');
                    if (!col || !col.classList.contains('mirror-visible')) continue;
                    var cell = col.querySelector('.cell-content');
                    if (!cell) continue;
                    var text = (cell.textContent || '').trim();
                    if (!text) continue;
                    var avail = Math.max(1, Math.floor(row.clientHeight) - 1);
                    cell.style.removeProperty('line-height');
                    void cell.offsetHeight;
                    var natural = measureMirrorCellNaturalHeight(cell, col);
                    void cell.offsetHeight;
                    if (natural >= avail - 2) continue;
                    var cs = window.getComputedStyle(cell);
                    var fontPx = parseFloat(cs.fontSize) || 16;
                    var lo = parseFloat(cs.lineHeight);
                    if (isNaN(lo) || lo < fontPx * 1.02) lo = fontPx * 1.15;
                    var hi = Math.max(lo + 1, avail * 2.5);
                    for (var iter = 0; iter < 30; iter++) {
                        var mid = (lo + hi) / 2;
                        var h = measureMirrorHeightAtLh(cell, col, mid);
                        clearMirrorBalanceProbe(cell);
                        cell.style.removeProperty('line-height');
                        if (h > avail) hi = mid;
                        else lo = mid;
                    }
                    cell.style.removeProperty('line-height');
                    void cell.offsetHeight;
                    cell.style.setProperty('line-height', lo + 'px', 'important');
                }
            }

            function handleMessage(e) {
                const data = e.data || {};
                const type = data.type;
                if (type === 'mirrorForceLayout' && data.layout) {
                    applyMirrorLayout(data.layout);
                }
                if (type === 'mirrorPillSync') {
                    applyMirrorPills(data);
                }
                if (type === 'loadContent') {
                    ensureMirrorTopChrome();
                    applyMirrorPills(data);
                    if (data.table && Array.isArray(data.table)) {
                        var visibleColumnIndex = typeof data.visibleColumnIndex === 'number' ? data.visibleColumnIndex : 0;
                        if (data.contentWidth) {
                            document.documentElement.style.setProperty('--mirror-content-width', data.contentWidth);
                        }
                        var html = '';
                        data.table.forEach(function(row) {
                            var cells = row.cells || [];
                            var rowClass = (row.rowClass || '') + (row.font12 ? ' mirror-row-font-12' : '');
                            html += '<div class="script-row-wrapper' + (rowClass ? ' ' + rowClass.trim() : '') + '">';
                            cells.forEach(function(cellText, ci) {
                                var visible = (ci === visibleColumnIndex) ? ' mirror-visible' : '';
                                var markup = normalizeMirrorCellMarkup(cellText);
                                html += '<div class="script-column' + visible + '"><div class="cell-content">' + markup + '</div></div>';
                            });
                            html += '</div>';
                        });
                        display.innerHTML = html;
                        if (data.rowHeights && Array.isArray(data.rowHeights)) {
                            var mirrorRows = display.querySelectorAll('.script-row-wrapper');
                            if (mirrorRows.length === data.rowHeights.length) {
                                data.rowHeights.forEach(function(h, i) {
                                    if (mirrorRows[i] && typeof h === 'number' && h > 0) {
                                        mirrorRows[i].style.minHeight = h + 'px';
                                        mirrorRows[i].style.height = h + 'px';
                                    }
                                });
                            }
                        }
                        applyMirrorLayout(data.layout);
                        var visIdx = typeof data.visibleColumnIndex === 'number' ? data.visibleColumnIndex : 0;
                        var hasRowHeights = data.rowHeights && Array.isArray(data.rowHeights) && data.rowHeights.length > 0;
                        var layoutSnap = data.layout || defaultMirrorLayoutFromViewport();
                        requestAnimationFrame(function() {
                            requestAnimationFrame(function() {
                                if (layoutSnap) applyMirrorLayout(layoutSnap);
                                if (!hasRowHeights) applyMirrorShortColumnLineBalance(display, visIdx);
                            });
                        });
                    }
                }
                if (type === 'syncStyleLite' && data.style) {
                    const s = data.style;
                    display.style.fontSize = s.fontSize || '';
                    display.style.fontFamily = s.fontFamily || '';
                    display.style.lineHeight = s.lineHeight || '';
                    const pad = [s.paddingTop || '10px', s.paddingRight || '40px', s.paddingBottom || '10px', s.paddingLeft || '40px'].join(' ');
                    document.documentElement.style.setProperty('--mirror-pad', pad);
                    document.documentElement.style.setProperty('--mirror-line-height', s.lineHeight || '1.4');
                    document.documentElement.style.setProperty('--mirror-content-width', s.contentWidth || '100%');
                    applyMirrorPills(data);
                    if (data.layout) applyMirrorLayout(data.layout);
                }
                if (type === 'pixelSync') {
                    lastPixelSyncData = data;
                    var scrollOnly = !!data.scrollOnly;
                    suppressMirrorScrollPosts = scrollOnly ? 4 : 2;
                    if (!scrollOnly) {
                        applyMirrorPills(data);
                        if (data.layout) applyMirrorLayout(data.layout);
                        void container.offsetHeight;
                    }
                    applyMirrorScrollSync(data);
                    applyMirrorIndicatorGuide(data);
                    if (!scrollOnly) {
                        requestAnimationFrame(function() {
                            suppressMirrorScrollPosts = 2;
                            applyMirrorScrollSync(data);
                            applyMirrorIndicatorGuide(data);
                        });
                    }
                }
                if (type === 'setPosition') {
                    try {
                        var left = parseInt(data.left, 10), top = parseInt(data.top, 10);
                        var w = parseInt(data.width, 10), h = parseInt(data.height, 10);
                        if (!isNaN(left) && !isNaN(top)) window.moveTo(left, top);
                        if (!isNaN(w) && w > 0 && !isNaN(h) && h > 0) window.resizeTo(w, h);
                        if (typeof window.__teleprompterScheduleMirrorFullscreen === 'function') {
                            window.__teleprompterScheduleMirrorFullscreen();
                        }
                    } catch (err) {}
                }
                if (type === 'updateRowHeights' && data.rowHeights && Array.isArray(data.rowHeights)) {
                    var mirrorRows = display.querySelectorAll('.script-row-wrapper');
                    if (mirrorRows.length === data.rowHeights.length) {
                        data.rowHeights.forEach(function(h, i) {
                            if (mirrorRows[i] && typeof h === 'number' && h > 0) {
                                mirrorRows[i].style.minHeight = h + 'px';
                                mirrorRows[i].style.height = h + 'px';
                            }
                        });
                    }
                }
            }

            container.addEventListener('scroll', function() {
                if (suppressMirrorScrollPosts > 0) {
                    suppressMirrorScrollPosts--;
                    return;
                }
                postToMain({
                    type: 'mirrorScroll',
                    scrollTop: container.scrollTop,
                    scrollHeight: container.scrollHeight,
                    clientHeight: container.clientHeight
                });
            });

            var mirrorViewportReportTimer = null;
            function reportMirrorViewportWidth() {
                if (!container) return;
                var cs = window.getComputedStyle(container);
                var pl = parseFloat(cs.paddingLeft) || 0;
                var pr = parseFloat(cs.paddingRight) || 0;
                var w = Math.floor(container.clientWidth - pl - pr);
                if (w > 50) postToMain({ type: 'mirrorViewportWidth', contentWidthPx: w });
            }
            function scheduleMirrorViewportReport() {
                if (mirrorViewportReportTimer) clearTimeout(mirrorViewportReportTimer);
                mirrorViewportReportTimer = setTimeout(reportMirrorViewportWidth, 80);
            }

            window.addEventListener('message', handleMessage);
            window.addEventListener('resize', function() {
                scheduleMirrorViewportReport();
                if (lastPixelSyncData) applyMirrorIndicatorGuide(lastPixelSyncData);
            });

            /* Position and size are set by the opener (main window). Do not move/resize here – on PC, screen reports the primary monitor and would pull the window off the intended monitor. */

            ensureMirrorTopChrome();
            postToMain({ type: 'mirrorReady' });
            scheduleMirrorViewportReport();
        })();
    </script>
</body>
</html>
